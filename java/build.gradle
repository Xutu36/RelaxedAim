plugins {
    id 'java'
    // ZombieBuddy JAR 签名（可选）。需在 gradle.properties 配置 zbsSteamID64 与 zbsPrivateKeyFile，
    // 否则 signJarZBS 会跳过/失败，不影响普通构建。
    id 'io.github.zed-0xff.zb-gradle-plugin' version '1.0.0'
}

def gameDir = file('D:/steam/steamapps/common/ProjectZomboid')
def modDir = file('../42')
def zombieBuddyJar = file('D:/steam/steamapps/workshop/content/108600/3619862853/mods/ZombieBuddy/libs/ZombieBuddy.jar')

repositories {
    mavenCentral()
}

// ZombieBuddy 签名配置：签名产物为 RelaxedAim.jar + RelaxedAim.jar.zbs
zbSigning {
    jarTask = 'jar'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // The game and ZombieBuddy provide these classes at runtime. Do not package them in this mod JAR.
    compileOnly files(new File(gameDir, 'projectzomboid.jar'))
    compileOnly files(zombieBuddyJar.exists() ? zombieBuddyJar : new File(gameDir, 'ZombieBuddy.jar'))
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

jar {
    archiveBaseName.set('RelaxedAim')
    archiveVersion.set('')
    archiveClassifier.set('')
}

tasks.register('installMod', Copy) {
    dependsOn tasks.named('jar')
    from(tasks.named('jar'))
    into(new File(modDir, 'media/java/client'))
    rename { 'RelaxedAim.jar' }
}

tasks.named('build') {
    finalizedBy(tasks.named('installMod'))
}

tasks.register('deployLocalMod', Sync) {
    dependsOn tasks.named('installMod')
    into file('C:/Users/Administrator/Zomboid/mods/RelaxedAim')
    from(file('../common')) {
        into 'common'
    }
    from(file('../42')) {
        into '42'
    }
}
